name: 测试问题反馈
description: 报告剧本或资产插件的可复现问题与设计偏差
body:
  - type: input
    id: snapshot
    attributes:
      label: 快照与插件版本
      placeholder: public-test-2026-10-27-r2；asset-design 0.1.0；scene-assets 0.9.5
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: 问题所属
      options:
        - 剧本标准化
        - 场记表提取
        - 剧本资产表提取
        - 资产总控
        - 角色设计
        - 场景设计
        - 道具设计
        - 安装或交接
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 输入与复现步骤
      description: 提供输入格式、操作和最小片段；可用合成示例。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 预期与实际结果
      description: 写明具体场次、资产或部位；可附错误信息与对照图。
    validations:
      required: true
